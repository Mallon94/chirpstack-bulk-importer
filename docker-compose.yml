version: "3.8"

services:
  chirpstack-importer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_CHIRPSTACK_URL=${VITE_CHIRPSTACK_URL}
        - VITE_CHIRPSTACK_API_TOKEN=${VITE_CHIRPSTACK_API_TOKEN}
        - VITE_CHIRPSTACK_APPLICATION_ID=${VITE_CHIRPSTACK_APPLICATION_ID}
        - VITE_CHIRPSTACK_DEVICE_PROFILE_ID=${VITE_CHIRPSTACK_DEVICE_PROFILE_ID}
    container_name: chirpstack-bulk-importer
    ports:
      - "80:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - chirpstack-network

networks:
  chirpstack-network:
    driver: bridge
