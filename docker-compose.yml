version: '3.8'

services:
  chirpstack-importer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chirpstack-bulk-importer
    ports:
      - "80:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - chirpstack-network

networks:
  chirpstack-network:
    driver: bridge